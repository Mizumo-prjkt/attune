[workspace]
resolver = "2"
members = [
    "crates/attune-dsp-ffi",
    "crates/attune-core",
    "crates/attune-cli",
    "crates/attune-ffi",
    "crates/watchguard",
    "crates/attune-music-metadata",
    "crates/attune-procmgr",
    "crates/attune-desktop",
    "crates/attune-player-syscore-playertoast-broadcast",
]

[workspace.package]
version = "0.1.1-rc1"
edition = "2021"
authors = ["Mizumo-prjkt <bluepearl394@gmail.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
hound = "3.5"
blake3 = "1.8"
rustfft = "6.4"
realfft = "3.5"
symphonia = { version = "0.5.5", features = ["all"] }
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.34", features = ["bundled"] }
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false }
rayon = "1.12"
