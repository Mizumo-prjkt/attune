[workspace]
resolver = "2"
members = [
    "crates/attune-dsp-ffi",
    "crates/attune-core",
    "crates/attune-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mizumo-prjkt <bluepearl394@gmail.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
hound = "3.5"
blake3 = "1.5"
rustfft = "6.4"
realfft = "3.4"
symphonia = { version = "0.5.4", features = ["all"] }
clap = { version = "4.5", features = ["derive"] }
