[package]
name = "attune-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Rust Dioxus desktop frontend for Attune (Windows & Linux), superseding the Flutter desktop shell"

[[bin]]
name = "attune-desktop"
path = "src/main.rs"

[dependencies]
attune-core = { path = "../attune-core" }
attune-player-syscore-playertoast-broadcast = { path = "../attune-player-syscore-playertoast-broadcast" }
dioxus = { version = "0.6", features = ["desktop"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
rfd = "0.15"
dirs = "6.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["time", "sync"] }
libc = "0.2"
sha2 = "0.10"
blake3 = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
ureq = { workspace = true, features = ["json", "tls"] }
