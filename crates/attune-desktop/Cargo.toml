[package]
name = "attune-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Rust Dioxus desktop frontend for Attune (Windows & Linux), superseding the Flutter desktop shell"

[[bin]]
name = "attune-desktop"
path = "src/main.rs"

[dependencies]
attune-core = { path = "../attune-core" }
attune-music-metadata-changer = { path = "../attune-music-metadata-changer" }
dioxus = { version = "0.6", features = ["desktop"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
rfd = "0.15"
dirs = "6.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["time", "sync"] }
log = { workspace = true }
env_logger = { workspace = true }
