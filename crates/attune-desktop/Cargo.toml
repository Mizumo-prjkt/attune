[package]
name = "attune-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Rust egui desktop frontend for Attune (Windows & Linux), superseding the Flutter desktop shell"

[[bin]]
name = "attune-desktop"
path = "src/main.rs"

[dependencies]
attune-core = { path = "../attune-core" }
attune-music-metadata-changer = { path = "../attune-music-metadata-changer" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.33", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.15"
dirs = "6.0"
serde = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
