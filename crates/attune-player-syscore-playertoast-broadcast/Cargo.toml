[package]
name = "attune-player-syscore-playertoast-broadcast"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "System-level player toast notification and media toolbar broadcaster for Attune (KDE/GNOME MPRIS & Windows Toast)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
playwire = "2.1.0"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus = "5.19"
zvariant = "5.14"

[dev-dependencies]
tempfile = "3"
