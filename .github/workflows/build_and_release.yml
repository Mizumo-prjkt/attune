name: Attune Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Compilation Mode (release, debug, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug
      version_override:
        description: 'Version ID Override (e.g., 0.1.0, 1.0.0; leave blank for pubspec.yaml default)'
        required: false
        default: ''
        type: string
      rust_version_override:
        description: 'Rust Crate Version ID Override (leave blank for Cargo.toml default)'
        required: false
        default: ''
        type: string
      localversion:
        description: 'Suffix version ID (e.g., -rc1, -beta)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }} - ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows, android]
        mode: [release, debug]
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: android
            os: ubuntu-latest
        exclude:
          - mode: ${{ github.event_name == 'pull_request' && 'debug' || (inputs.build_mode == 'release' && 'debug' || (inputs.build_mode == 'debug' && 'release' || 'none')) }}

    steps:
      - name: Checkout Code Repository (Full History for Patch Notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'android' && 'aarch64-linux-android,x86_64-linux-android' || '' }}

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Java (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK
        if: matrix.target == 'android'
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install Linux Build Dependencies (Ubuntu)
        if: runner.os == 'Linux' && matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libasound2-dev \
            libpulse-dev \
            libayatana-appindicator3-dev \
            file

      - name: Setup Inno Setup (Windows)
        if: runner.os == 'Windows'
        uses: crazy-max/ghaction-innosetup@v3

      - name: Run Attune Unified Build & Packaging Orchestrator
        shell: bash
        run: |
          LOCAL_VER="${{ github.event.inputs.localversion || '' }}"
          VER_OVERRIDE="${{ github.event.inputs.version_override || '' }}"
          RUST_VER_OVERRIDE="${{ github.event.inputs.rust_version_override || '' }}"
          python tools/builder.py \
            --no-gui \
            --target "${{ matrix.target }}" \
            --mode "${{ matrix.mode }}" \
            --version "${VER_OVERRIDE}" \
            --rust-version "${RUST_VER_OVERRIDE}" \
            --localversion "${LOCAL_VER}" \
            --step all

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: attune-${{ matrix.target }}-${{ matrix.mode }}
          path: |
            dist/**/*
            patch_notes.txt
          if-no-files-found: warn

  release:
    name: Publish GitHub Release Draft
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version_override != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Release Patch Notes
        run: |
          python tools/builder.py \
            --no-gui \
            --step patchnotes \
            --version "${{ github.event.inputs.version_override || '' }}" \
            --localversion "${{ github.event.inputs.localversion || '' }}"

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_override != '' && format('v{0}{1}', github.event.inputs.version_override, github.event.inputs.localversion) || github.ref_name }}
          body_path: patch_notes.txt
          draft: true
          prerelease: false
          files: release-artifacts/**/*
